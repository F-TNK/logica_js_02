<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frete por Região | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <div class="page">
        <a href="../index.html">MENU</a>
      </div>
    </header>
    <main class="exercicio">
      <h1>Frete por Região</h1>

      <label for="val">Valor da compra (R$)</label>
      <input type="number" id="val" step="0.01" />

      <label for="regiao">Região</label>
      <select name="regiao" id="regiao"></select>
      <option value="">--Selecione--</option>
      <option value="sul">Sul</option>
      <option value="sudeste">Sudeste</option>
      <option value="centro-oeste">Centro-Oeste</option>
      <option value="nordeste">Nordeste</option>
      <option value="norte">Norte</option>

      <button id="button">Calcular</button>
      <p id="resultado" class="resultado"></p>
    </main>
    <script src="js/imc.js"></script>
  </body>
</html>
