<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IMC | Lógica com JS</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header>
      <div class="page">
        <a href="../index.html">MENU</a>
      </div>
    </header>
    <main class="exercicio">
      <h1>Calculo de IMC</h1>

      <label for="peso">Peso (Kg)</label>
      <input type="number" id="peso" step="0.1" />
      <label for="alt">Altura (m)</label>
      <input type="number" id="alt" step="0.1" />

      <button id="button">Calcular</button>
      <p id="result" class="result"></p>
      <p id="resultado" class="resultado"></p>
    </main>
    <script src="js/imc.js"></script>
  </body>
</html>
